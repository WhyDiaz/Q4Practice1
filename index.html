<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice1</title>
</head>
<body>
    <h1>JavaScript Conditional Statements</h1>

    <input type="text" class="form-control" id="Age" placeholder="Tell us your age NOW">
    <button class="btn btn-info" onclick="checkAge()">checkAge</button>

    <script>
        function checkAge() {
        var Age = document.getElementById("Age").value;

            if(Age<18){
                alert("You are a minor. And enjoy your childhood.");
            }
           
            else if(Age>18){
                alert("You are an adult and you can do whatever you want. However, you should be responsible for your actions. Moreover, you should be careful about your health and safety. Lastly, you should be careful about your financial situation.");
            }    
           
            else{
                alert("You are NOT a minor, Don't touch me.");
            }
        }
    </script>
</body>
</html>
