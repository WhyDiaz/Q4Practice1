<body>
    <h1>JavaScript Conditional Statements</h1>

    <input type="text" class="form-control" id="Age" placeholder="Tell us your age NOW">
    <button class="btn btn-info" onclick="checkAge()">checkAge</button>

    <script>
        function checkAge() {
        var Age = document.getElementById("Age").value;

            if (isNaN(Age) || Age <0) {
                alert("Please enter a valid age.");
            }
            else if(Age<18){
                alert("You are a minor. And enjoy your childhood.");
            }
           
            else if(Age>18){
                alert("You are an adult and you can do whatever you want. However, you should be responsible for your actions. Moreover, you should be careful about your health and safety. Lastly, you should be careful about your financial situation. Now if ever you are in trouble, you can ask for help from your parents, friends, or even a professional. But remember, you should always be careful about your actions and decisions. Lastly, you should always be careful about your health and safety. Now if ever you are in trouble, you can ask for help from your parents, friends, or even a professional. And if ever your in jail dont forget to be nice to your cellmates and guards. And remember this, never forget to be kind to others, because you never know when you might need help from them. Lastly, always remember to be kind to yourself, because you are the only one who can take care of yourself. And if ever you are in trouble, don't forget to ask for help from your parents, friends, or even a professional. And if ever your in jail dont forget to be nice to your cellmates and guards. And remember this, never forget to be kind to others, because you never know when you might need help from them. Lastly, always remember to be kind to yourself, because you are the only one who can take care of yourself.");
            }    
           
            else{
                alert("You are NOT a minor, Don't touch me.");
            }
        }
    </script>
